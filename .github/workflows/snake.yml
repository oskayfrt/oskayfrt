
name: Generate Snake and Pac-Man

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-animations
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: oskayfrt
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: oskayfrt
          games: pacman

      - name: Find and verify animations
        shell: bash
        run: |
          echo "All SVG files:"
          find . -type f -name "*.svg" -print

          mkdir -p dist

          for filename in \
            pacman-contribution-graph.svg \
            pacman-contribution-graph-dark.svg
          do
            if [ ! -f "dist/$filename" ]; then
              found=$(find . -type f -name "$filename" -print -quit)

              if [ -n "$found" ]; then
                cp "$found" "dist/$filename"
              fi
            fi

            if [ ! -s "dist/$filename" ]; then
              echo "::error::Missing file: $filename"
              exit 1
            fi
          done

          echo "Final files:"
          ls -lh dist/

      - name: Publish Animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
