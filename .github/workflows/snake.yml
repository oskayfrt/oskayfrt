name: Generate Snake and Pac-Man

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-animations
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: oskayfrt
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: oskayfrt
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Verify both animations before publishing
        shell: bash
        run: |
          set -euo pipefail
          echo "SVG files generated in workspace:"
          find . -type f -name '*.svg' -print
          for filename in \
            github-contribution-grid-snake.svg \
            github-contribution-grid-snake-dark.svg \
            pacman-contribution-graph.svg \
            pacman-contribution-graph-dark.svg
          do
            if [ ! -s "dist/$filename" ]; then
              found=$(find . -type f -name "$filename" -not -path "./dist/$filename" -print -quit)
              if [ -n "$found" ]; then
                cp "$found" "dist/$filename"
              fi
            fi
            if [ ! -s "dist/$filename" ]; then
              echo "::error::Expected animation is missing: dist/$filename"
              exit 1
            fi
          done
          echo "All four SVG animations are present:"
          ls -lh dist/*.svg

      - name: Publish Animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
