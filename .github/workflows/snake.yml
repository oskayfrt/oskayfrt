
name: Generate Snake and Pac-Man

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-animations
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: oskayfrt
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: oskayfrt
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Check generated animation files
        run: |
          echo "Generated animation files:"
          find dist -maxdepth 3 -type f -print
          echo "Checking Pac-Man files:"
          test -f dist/pacman-contribution-graph.svg
          test -f dist/pacman-contribution-graph-dark.svg

      - name: Publish Animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
